<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>US Flight Traffic Simulator (Pro) - Multi-Route Edition</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #080d1a; color: #f3f4f6; overflow: hidden; }
    .container { display: flex; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; flex-direction: column; }
    .main-layout { display: flex; flex: 1; gap: 20px; min-height: 0; }
    
    .sidebar { width: 320px; display: flex; flex-direction: column; gap: 15px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid #1f2937; overflow-y: auto; }
    .clock { font-size: 42px; font-weight: bold; color: #60a5fa; font-family: monospace; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 10px; }
    
    .stats-panel { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #374151; }
    .section-title { font-size: 11px; color: #9ca3af; margin-bottom: 10px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
    
    select[multiple] { height: 150px; background: #1f2937; border: 1px solid #374151; color: white; padding: 5px; border-radius: 4px; width: 100%; font-size: 13px; outline: none; }
    input { background: #1f2937; border: 1px solid #374151; color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }

    #canvas-wrapper { flex: 1; position: relative; background: #05080f; border-radius: 12px; border: 1px solid #374151; }
    canvas { width: 100%; height: 100%; display: block; }

    .timeline-container { background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 12px; border: 1px solid #1f2937; display: flex; align-items: center; gap: 20px; }
    #time-slider { flex: 1; cursor: pointer; accent-color: #3b82f6; }

    .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
    .stat-val { font-family: monospace; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <div class="sidebar">
        <h2 style="margin:0; font-size: 18px; color: #94a3b8;">US AIRSPACE MONITOR</h2>
        <div class="clock" id="clock">00:00</div>

        <div class="stats-panel">
          <div class="section-title">📅 MULTI-DATE SELECT</div>
          <select id="date-selector" multiple></select>
          <div style="font-size: 10px; color: #4b5563; margin-top: 5px;">Hold Ctrl/Cmd for Multiple Days</div>
        </div>

        <div class="stats-panel">
          <div class="section-title">⚡ SIM SPEED</div>
          <input type="number" id="speed-input" value="100" min="1" step="10">
        </div>

        <div class="stats-panel">
          <div class="section-title">📍 ORIGIN FILTER</div>
          <div id="airport-filters"></div>
        </div>

        <div class="stats-panel">
          <div class="section-title">LIVE STATISTICS</div>
          <div class="stat-row">Active: <span id="count-active" class="stat-val" style="color:#60a5fa">0</span></div>
          <div class="stat-row">On-Time: <span id="count-ontime" class="stat-val" style="color:#10b981">0</span></div>
          <div class="stat-row">Delayed: <span id="count-delayed" class="stat-val" style="color:#f59e0b">0</span></div>
          <div class="stat-row">Cancelled: <span id="count-cancelled" class="stat-val" style="color:#ef4444">0</span></div>
        </div>
      </div>

      <div id="canvas-wrapper">
        <canvas id="flight-canvas"></canvas>
      </div>
    </div>

    <div class="timeline-container">
      <span style="color: #4b5563; font-family: monospace;">00:00</span>
      <input type="range" id="time-slider" min="0" max="1440" value="480">
      <span style="color: #4b5563; font-family: monospace;">23:59</span>
    </div>
  </div>

  <script>
    const airportCoords = {
      "ORD": { x: 0.66, y: 0.35 }, "ATL": { x: 0.75, y: 0.65 },
      "LAX": { x: 0.10, y: 0.65 }, "DFW": { x: 0.50, y: 0.75 },
      "DEN": { x: 0.40, y: 0.45 }, "JFK": { x: 0.90, y: 0.32 },
      "SEA": { x: 0.15, y: 0.15 }, "SLC": { x: 0.25, y: 0.45 }
    };

    const jsonFiles = [
      { name: "ORD", path: "flight_ord_all.json" },
      { name: "JFK", path: "flight_jfk_all.json" },
      { name: "ATL", path: "flight_atl_all.json" },
      { name: "LAX", path: "flight_lax_all.json" },
      { name: "DEN", path: "flight_den_all.json" },
      { name: "DFW", path: "flight_dfw_all.json" },
      { name: "SEA", path: "flight_sea_all.json" },
      { name: "SLC", path: "flight_slc_all.json" }
    ];

    let allFlightData = [];
    let activeOrigins = new Set();
    let selectedDates = new Set();
    let currentTime = 480; 
    let speedMultiplier = 100;
    let isDragging = false;

    const canvas = document.getElementById("flight-canvas");
    const ctx = canvas.getContext("2d");
    const timeSlider = document.getElementById("time-slider");

    document.getElementById("speed-input").oninput = (e) => {
      speedMultiplier = parseFloat(e.target.value) || 0;
    };

    timeSlider.oninput = (e) => { isDragging = true; currentTime = parseInt(e.target.value); };
    timeSlider.onchange = () => { isDragging = false; };

    async function init() {
      const loadPromises = jsonFiles.map(async (file) => {
        try {
          const res = await fetch(file.path);
          const data = await res.json();
          return data.map(d => ({ ...d, ORIGIN: file.name }));
        } catch(e) { return []; }
      });

      const results = await Promise.all(loadPromises);
      allFlightData = results.flat();

      const dateSet = [...new Set(allFlightData.map(d => d.date))].sort();
      const selector = document.getElementById("date-selector");
      dateSet.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        selector.appendChild(opt);
      });
      
      selector.selectedIndex = 0;
      selectedDates.add(dateSet[0]);
      selector.onchange = (e) => {
        selectedDates = new Set(Array.from(e.target.selectedOptions).map(opt => opt.value));
      };

      const filterBox = document.getElementById("airport-filters");
      jsonFiles.forEach(file => {
        activeOrigins.add(file.name);
        const div = document.createElement("div");
        div.style.fontSize = "12px";
        div.innerHTML = `<label><input type="checkbox" checked id="chk-${file.name}"> ${file.name}</label>`;
        div.querySelector("input").onchange = (e) => {
          if (e.target.checked) activeOrigins.add(file.name);
          else activeOrigins.delete(file.name);
        };
        filterBox.appendChild(div);
      });

      requestAnimationFrame(draw);
    }

    function draw() {
      const { width, height } = canvas;
      ctx.fillStyle = "rgba(5, 8, 15, 0.5)"; 
      ctx.fillRect(0, 0, width, height);

      let stats = { ontime: 0, delayed: 0, cancelled: 0, active: 0 };

      // 1. 점선 경로 가이드 그리기
      allFlightData.forEach(f => {
        if (!activeOrigins.has(f.ORIGIN) || !selectedDates.has(f.date)) return;
        
        const start = airportCoords[f.ORIGIN];
        const end = airportCoords[f.DEST];
        
        if (start && end) {
          ctx.beginPath();
          ctx.setLineDash([2, 8]); // 점선 설정
          ctx.moveTo(start.x * width, start.y * height);
          ctx.lineTo(end.x * width, end.y * height);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.05)"; 
          ctx.stroke();
        }
      });
      ctx.setLineDash([]); // 점선 초기화

      // 2. 비행기 이동 및 통계
      allFlightData.forEach(f => {
        if (!activeOrigins.has(f.ORIGIN) || !selectedDates.has(f.date)) return;

        // 결항(Cancelled) 데이터는 별도 필드가 없을 경우 status로 판단
        if (f.status === "Cancelled") {
            if (currentTime >= f.dep_minutes) stats.cancelled++;
            return; 
        }

        if (currentTime >= f.dep_minutes) {
          if (f.status === "Delayed") stats.delayed++;
          else stats.ontime++;
        }

        if (currentTime >= f.dep_minutes && currentTime <= f.dep_minutes + f.duration) {
          const progress = (currentTime - f.dep_minutes) / f.duration;
          const start = airportCoords[f.ORIGIN];
          const end = airportCoords[f.DEST];

          if (start && end) {
            stats.active++;
            const curX = (start.x + (end.x - start.x) * progress) * width;
            const curY = (start.y + (end.y - start.y) * progress) * height;
            
            // 비행기 점
            ctx.fillStyle = f.status === "Delayed" ? "#f59e0b" : "#10b981";
            ctx.beginPath();
            ctx.arc(curX, curY, 3, 0, Math.PI * 2);
            ctx.fill();
            
            // 글로우 효과
            ctx.shadowBlur = 8;
            ctx.shadowColor = f.status === "Delayed" ? "#f59e0b" : "#10b981";
            ctx.fill();
            ctx.shadowBlur = 0;
          }
        }
      });

      // 공항 이름 표시
      Object.keys(airportCoords).forEach(key => {
        const {x, y} = airportCoords[key];
        ctx.fillStyle = "#1f2937";
        ctx.beginPath(); ctx.arc(x * width, y * height, 4, 0, Math.PI*2); ctx.fill();
        ctx.font = "10px sans-serif";
        ctx.fillStyle = "#4b5563";
        ctx.fillText(key, x * width + 6, y * height + 3);
      });

      // UI 업데이트
      document.getElementById("count-active").textContent = stats.active.toLocaleString();
      document.getElementById("count-ontime").textContent = stats.ontime.toLocaleString();
      document.getElementById("count-delayed").textContent = stats.delayed.toLocaleString();
      document.getElementById("count-cancelled").textContent = stats.cancelled.toLocaleString();
      document.getElementById("clock").textContent = formatTime(currentTime);
      if(!isDragging) timeSlider.value = currentTime;

      if (!isDragging) {
        currentTime += (0.1 * speedMultiplier / 60); 
        if (currentTime > 1440) currentTime = 0;
      }
      
      requestAnimationFrame(draw);
    }

    function formatTime(mins) {
      const h = Math.floor(mins / 60) % 24;
      const m = Math.floor(mins % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    window.onresize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    window.onresize();
    init();
  </script>
</body>
</html>
