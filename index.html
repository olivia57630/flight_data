<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>US Flight Traffic Simulator</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #0b1020; color: #f3f4f6; overflow: hidden; }
    .container { display: flex; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; }
    .sidebar { width: 300px; display: flex; flex-direction: column; gap: 15px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid #1f2937; overflow-y: auto; }
    .clock { font-size: 42px; font-weight: bold; color: #60a5fa; font-family: monospace; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 10px; }
    .stats-panel { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #374151; }
    .stat-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
    .filter-group { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid #1f2937; }
    .section-title { font-size: 12px; font-weight: bold; margin-bottom: 10px; color: #9ca3af; text-transform: uppercase; }
    #canvas-wrapper { flex: 1; position: relative; background: #0f172a; border-radius: 12px; border: 1px solid #374151; }
    canvas { width: 100%; height: 100%; display: block; }
    .speed-btn { padding: 6px 10px; cursor: pointer; background: #374151; border: none; color: white; border-radius: 4px; font-size: 12px; }
    .speed-btn.active { background: #3b82f6; }
    #delay-info { position: absolute; bottom: 20px; right: 20px; width: 260px; background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 8px; border-left: 4px solid #f59e0b; display: none; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h2 style="margin:0; font-size: 20px;">FLIGHT TRACKER</h2>
      <div class="clock" id="clock">00:00</div>

      <div class="stats-panel">
        <div class="section-title">Simulation Status</div>
        <div class="stat-item">Airborne (Active): <span id="count-active" style="color:#60a5fa; font-weight:bold;">0</span></div>
        <div class="stat-item">On-Time (Total): <span id="count-ontime" style="color:#10b981">0</span></div>
        <div class="stat-item">Delayed (Total): <span id="count-delayed" style="color:#f59e0b">0</span></div>
      </div>

      <div class="filter-group">
        <div class="section-title">Origin Filter</div>
        <div id="airport-filters"></div>
      </div>
      
      <div class="filter-group">
        <div class="section-title">Sim Speed</div>
        <div style="display: flex; gap: 5px; flex-wrap: wrap;">
          <button class="speed-btn" data-speed="1">1x</button>
          <button class="speed-btn active" data-speed="20">20x</button>
          <button class="speed-btn" data-speed="100">100x</button>
          <button class="speed-btn" data-speed="500">Fast</button>
        </div>
        <p style="font-size: 11px; color: #64748b; margin-top: 10px;">* 데이터가 적으면 빠르게 돌려보세요.</p>
      </div>
    </div>

    <div id="canvas-wrapper">
      <canvas id="flight-canvas"></canvas>
      <div id="delay-info">
        <div style="font-size:11px; color:#f59e0b; font-weight:bold; margin-bottom:5px;">DELAY INFO</div>
        <div id="delay-text" style="font-size:14px;"></div>
      </div>
    </div>
  </div>

  <script>
    // 1. 공항 좌표 (미국 주요 공항 추가)
    const airportCoords = {
      "ORD": { x: 0.66, y: 0.35 }, "ATL": { x: 0.75, y: 0.65 },
      "LAX": { x: 0.10, y: 0.65 }, "DFW": { x: 0.50, y: 0.75 },
      "DEN": { x: 0.40, y: 0.45 }, "JFK": { x: 0.90, y: 0.32 },
      "SFO": { x: 0.08, y: 0.50 }, "SEA": { x: 0.15, y: 0.15 },
      "LAS": { x: 0.18, y: 0.58 }, "MIA": { x: 0.88, y: 0.88 },
      "PHX": { x: 0.25, y: 0.70 }, "BOS": { x: 0.93, y: 0.25 }
    };

    const jsonFiles = [
      { name: "ORD", path: "flight.json" }
    ];

    let allFlightData = [];
    let activeOrigins = new Set();
    let currentTime = 480; // 오전 8시부터 시작 (데이터가 보통 많은 시간)
    let speedMultiplier = 20;

    const canvas = document.getElementById("flight-canvas");
    const ctx = canvas.getContext("2d");

    async function init() {
      try {
        const loadPromises = jsonFiles.map(async (file) => {
          const res = await fetch(file.path);
          const data = await res.json();
          return data.map(d => ({ ...d, ORIGIN: file.name }));
        });

        const results = await Promise.all(loadPromises);
        allFlightData = results.flat();

        const filterBox = document.getElementById("airport-filters");
        jsonFiles.forEach(file => {
          activeOrigins.add(file.name);
          const label = document.createElement("label");
          label.innerHTML = `<input type="checkbox" checked value="${file.name}"> ${file.name}`;
          label.querySelector("input").onchange = (e) => {
            if (e.target.checked) activeOrigins.add(file.name);
            else activeOrigins.delete(file.name);
          };
          filterBox.appendChild(label);
        });

        requestAnimationFrame(draw);
      } catch (err) {
        console.error("Data load failed:", err);
      }
    }

    function draw() {
      const { width, height } = canvas;
      ctx.fillStyle = "rgba(15, 23, 42, 0.4)"; // 잔상 효과
      ctx.fillRect(0, 0, width, height);

      // 공항 마커
      Object.keys(airportCoords).forEach(key => {
        const {x, y} = airportCoords[key];
        ctx.fillStyle = activeOrigins.has(key) ? "#334155" : "#1e293b";
        ctx.beginPath(); ctx.arc(x * width, y * height, 4, 0, Math.PI*2); ctx.fill();
        ctx.font = "11px sans-serif";
        ctx.fillStyle = "#64748b";
        ctx.fillText(key, x * width + 5, y * height + 15);
      });

      let stats = { ontime: 0, delayed: 0, active: 0 };

      allFlightData.forEach(f => {
        if (!activeOrigins.has(f.ORIGIN)) return;

        // 누적 통계
        if (currentTime >= f.dep_minutes) {
          if (f.status === "On-Time") stats.ontime++;
          else if (f.status === "Delayed") stats.delayed++;
        }

        // 비행 중인 기체 (Airborne)
        if (f.status !== "Cancelled" && currentTime >= f.dep_minutes && currentTime <= f.dep_minutes + f.duration) {
          const progress = (currentTime - f.dep_minutes) / f.duration;
          const start = airportCoords[f.ORIGIN];
          const end = airportCoords[f.DEST];

          // 목적지 좌표가 등록되어 있을 때만 그림
          if (start && end) {
            stats.active++;
            const curX = (start.x + (end.x - start.x) * progress) * width;
            const curY = (start.y + (end.y - start.y) * progress) * height;
            
            ctx.fillStyle = f.status === "Delayed" ? "#f59e0b" : "#10b981";
            ctx.shadowBlur = 5;
            ctx.shadowColor = ctx.fillStyle;
            ctx.beginPath(); ctx.arc(curX, curY, 5, 0, Math.PI * 2); ctx.fill();
            ctx.shadowBlur = 0;
            
            // 비행기 번호
            ctx.font = "10px monospace";
            ctx.fillStyle = "white";
            ctx.fillText(f.FL_NUM, curX + 7, curY - 5);
          }
        }
      });

      // UI 업데이트
      document.getElementById("count-ontime").textContent = stats.ontime;
      document.getElementById("count-delayed").textContent = stats.delayed;
      document.getElementById("count-active").textContent = stats.active;
      document.getElementById("clock").textContent = formatTime(currentTime);

      currentTime += (0.1 * speedMultiplier);
      if (currentTime > 1440) currentTime = 0;
      requestAnimationFrame(draw);
    }

    function formatTime(mins) {
      const h = Math.floor(mins / 60) % 24;
      const m = Math.floor(mins % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    // 속도 조절 버튼
    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        speedMultiplier = parseFloat(btn.dataset.speed);
      };
    });

    window.onresize = () => {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    };
    window.onresize();
    init();
  </script>
</body>
</html>
