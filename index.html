<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>US Airspace Monitor - Delay Tracker</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --sidebar-bg: #ffffff;
      --accent-blue: #3b82f6;
      --text-main: #1e293b;
      --border-color: #e2e8f0;
      --warning: #f59e0b;
      --success: #10b981;
    }

    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-color); overflow: hidden; }
    .container { display: flex; height: 100vh; padding: 15px; gap: 15px; box-sizing: border-box; flex-direction: column; }
    .main-layout { display: flex; flex: 1; gap: 15px; min-height: 0; }
    
    .sidebar { width: 300px; display: flex; flex-direction: column; gap: 12px; background: var(--sidebar-bg); padding: 18px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid var(--border-color); overflow-y: auto; }
    .clock { font-size: 36px; font-weight: 800; color: var(--accent-blue); font-family: monospace; text-align: center; margin-bottom: 10px; }
    
    .stats-panel { background: #f1f5f9; padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
    .section-title { font-size: 11px; color: #64748b; margin-bottom: 8px; text-transform: uppercase; font-weight: 700; }

    #canvas-wrapper { flex: 1; position: relative; background: #fff; border-radius: 15px; border: 1px solid var(--border-color); }
    canvas { width: 100%; height: 100%; display: block; }

    /* 툴팁 디자인 강화 */
    #tooltip { 
      position: fixed; 
      background: rgba(255, 255, 255, 0.98); 
      border: 2px solid var(--accent-blue); 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 13px; 
      pointer-events: none; 
      visibility: hidden; 
      z-index: 9999; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      color: #1e293b;
      line-height: 1.6;
    }

    .delay-text { color: var(--warning); font-weight: bold; font-size: 14px; border-top: 1px solid #eee; margin-top: 5px; padding-top: 5px; }
    .ontime-text { color: var(--success); font-weight: bold; }

    .btn-group { display: flex; gap: 5px; }
    .ctrl-btn { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--border-color); background: white; cursor: pointer; font-weight: bold; }
    .live-num { font-size: 22px; font-weight: 800; color: #ef4444; }

    .timeline-container { background: white; padding: 15px; border-radius: 15px; border: 1px solid var(--border-color); }
    #time-slider { width: 100%; accent-color: var(--accent-blue); }
  </style>
</head>
<body>
  <div id="tooltip"></div>
  <div class="container">
    <div class="main-layout">
      <div class="sidebar">
        <div class="clock" id="clock">00:00</div>
        <div class="btn-group">
          <button class="ctrl-btn" id="play-btn">▶ PLAY</button>
          <button class="ctrl-btn" id="pause-btn">⏸ PAUSE</button>
        </div>

        <div class="stats-panel">
          <div class="section-title">🛰 LIVE ON SCREEN</div>
          <div class="live-num" id="live-count">0 FLIGHTS</div>
        </div>

        <div class="stats-panel">
          <div class="section-title">📅 DATE SELECTION</div>
          <select id="date-selector" multiple style="width:100%; height:100px; font-size:12px;"></select>
        </div>

        <div class="stats-panel">
          <div class="section-title">📍 ORIGIN AIRPORTS</div>
          <div id="airport-filters" style="font-size: 12px; max-height: 150px; overflow-y: auto;"></div>
        </div>
      </div>

      <div id="canvas-wrapper">
        <canvas id="flight-canvas"></canvas>
      </div>
    </div>
    <div class="timeline-container">
      <input type="range" id="time-slider" min="0" max="1440" value="480" step="1">
    </div>
  </div>

  <script>
    const airportLocs = {
      "SEA": [-122.3088, 47.4502], "LAX": [-118.4085, 33.9416], "SLC": [-111.9777, 40.7899], 
      "DEN": [-104.6737, 39.8561], "DFW": [-97.0403, 32.8998], "ORD": [-87.9073, 41.9742], 
      "ATL": [-84.4277, 33.6407], "JFK": [-73.7781, 40.6413]
    };

    let allFlightData = [], activeOrigins = new Set(), selectedDates = new Set();
    let currentTime = 480, isPaused = false;
    let usaMap = null, interactivePoints = [];

    const canvas = document.getElementById("flight-canvas"), ctx = canvas.getContext("2d");
    const tooltip = document.getElementById("tooltip");

    async function init() {
      const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/nation-10m.json");
      usaMap = topojson.feature(us, us.objects.nation).features[0];

      const airportNames = Object.keys(airportLocs);
      const results = await Promise.all(airportNames.map(async name => {
        try { 
          const r = await fetch(`flight_${name.toLowerCase()}_all.json`);
          const data = await r.json();
          return data.map(d => ({...d, ORIGIN: name}));
        } catch(e) { return []; }
      }));
      allFlightData = results.flat();

      const dates = [...new Set(allFlightData.map(d => d.date))].sort();
      const sel = document.getElementById("date-selector");
      dates.forEach(d => { const o = document.createElement("option"); o.value = d; o.textContent = d; sel.appendChild(o); });
      sel.selectedIndex = 0; selectedDates.add(dates[0]);
      sel.onchange = (e) => selectedDates = new Set([...e.target.selectedOptions].map(o => o.value));

      const box = document.getElementById("airport-filters");
      airportNames.forEach(f => {
        activeOrigins.add(f);
        box.innerHTML += `<label style="display:block; margin-bottom:3px;"><input type="checkbox" checked value="${f}" onchange="this.checked ? activeOrigins.add('${f}') : activeOrigins.delete('${f}')"> <b>${f}</b></label>`;
      });

      // 마우스 좌표 보정 및 툴팁 로직
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const mx = (e.clientX - rect.left) * scaleX;
        const my = (e.clientY - rect.top) * scaleY;

        let hovered = null;
        for (const p of interactivePoints) {
          const dist = Math.hypot(p.x - mx, p.y - my);
          if (dist < 8) { hovered = p; break; }
        }

        if (hovered) {
          tooltip.style.visibility = "visible";
          tooltip.style.left = (e.clientX + 15) + "px";
          tooltip.style.top = (e.clientY + 15) + "px";
          
          if (hovered.type === 'airport') {
            tooltip.innerHTML = `<strong>📍 ORIGIN: ${hovered.id}</strong><br><span style="color:#64748b; font-size:11px;">Active departures shown</span>`;
          } else {
            const f = hovered.data;
            const delayInfo = f.status === "Delayed" ? `<div class="delay-text">⚠️ Delay: ${f.delay_amount} min</div>` : `<div class="ontime-text">✅ On-Time</div>`;
            tooltip.innerHTML = `
              <div style="font-weight:bold; color:#3b82f6; border-bottom:1px solid #eee; padding-bottom:3px; margin-bottom:5px;">✈ Flight ${f.FL_NUM}</div>
              <strong>To:</strong> ${f.DEST}<br>
              <strong>Tail:</strong> ${f.TAIL_NUM || 'N/A'}<br>
              ${delayInfo}
            `;
          }
        } else {
          tooltip.style.visibility = "hidden";
        }
      });

      requestAnimationFrame(draw);
    }

    function draw() {
      const { width, height } = canvas;
      ctx.clearRect(0, 0, width, height);
      const projection = d3.geoAlbersUsa().scale(width * 1.3).translate([width / 2, height / 2.2]);
      interactivePoints = [];

      if (usaMap) {
        ctx.beginPath(); ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1.5;
        d3.geoPath(projection, ctx)(usaMap); ctx.stroke(); ctx.fillStyle = "#fafafa"; ctx.fill();
      }

      // 공항 마커
      Object.entries(airportLocs).forEach(([key, loc]) => {
        const p = projection(loc);
        if (p) {
          interactivePoints.push({ x: p[0], y: p[1], id: key, type: 'airport' });
          ctx.fillStyle = activeOrigins.has(key) ? "#3b82f6" : "#cbd5e1";
          ctx.beginPath(); ctx.arc(p[0], p[1], 6, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = "#64748b"; ctx.font = "bold 12px Inter";
          ctx.fillText(key, p[0] + 10, p[1] + 5);
        }
      });

      // 비행기 궤적 및 점
      let liveCount = 0;
      allFlightData.forEach(f => {
        if (!activeOrigins.has(f.ORIGIN) || !selectedDates.has(f.date)) return;

        if (currentTime >= f.dep_minutes && currentTime <= f.dep_minutes + f.duration) {
          const s = projection(airportLocs[f.ORIGIN]), e = projection(airportLocs[f.DEST]);
          if (s && e) {
            const p = (currentTime - f.dep_minutes) / f.duration;
            const cx = s[0] + (e[0] - s[0]) * p, cy = s[1] + (e[1] - s[1]) * p;
            
            interactivePoints.push({ x: cx, y: cy, data: f, type: 'flight' });
            liveCount++;

            // 지연된 항공편은 더 크게 표시
            ctx.fillStyle = f.status === "Delayed" ? "#f59e0b" : "#10b981";
            ctx.beginPath(); ctx.arc(cx, cy, f.status === "Delayed" ? 5 : 4, 0, Math.PI*2); ctx.fill();
            if(f.status === "Delayed") { ctx.strokeStyle = "white"; ctx.lineWidth = 1; ctx.stroke(); }
          }
        }
      });

      document.getElementById("live-count").textContent = liveCount + " FLIGHTS";
      document.getElementById("clock").textContent = `${String(Math.floor(currentTime/60)%24).padStart(2,'0')}:${String(Math.floor(currentTime%60)).padStart(2,'0')}`;

      if (!isPaused) {
        currentTime += 0.2;
        if (currentTime >= 1440) currentTime = 0;
        document.getElementById("time-slider").value = currentTime;
      }
      requestAnimationFrame(draw);
    }

    document.getElementById("pause-btn").onclick = () => isPaused = true;
    document.getElementById("play-btn").onclick = () => isPaused = false;
    document.getElementById("time-slider").oninput = (e) => { currentTime = parseFloat(e.target.value); isPaused = true; };

    window.onresize = () => {
      canvas.width = canvas.offsetWidth * window.devicePixelRatio;
      canvas.height = canvas.offsetHeight * window.devicePixelRatio;
    };
    window.onresize();
    init();
  </script>
</body>
</html>
