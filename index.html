<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>US Airspace Monitor (Pro)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #05080f; color: #f3f4f6; overflow: hidden; }
    .container { display: flex; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; flex-direction: column; }
    .main-layout { display: flex; flex: 1; gap: 20px; min-height: 0; }
    
    .sidebar { width: 300px; display: flex; flex-direction: column; gap: 15px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid #1f2937; overflow-y: auto; }
    .clock { font-size: 36px; font-weight: bold; color: #60a5fa; font-family: monospace; text-align: center; margin-bottom: 10px; }
    
    .stats-panel { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #374151; }
    .section-title { font-size: 11px; color: #9ca3af; margin-bottom: 8px; text-transform: uppercase; font-weight: bold; }
    
    /* 배속 버튼 스타일 */
    .speed-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
    .speed-btn { background: #374151; border: none; color: white; padding: 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .speed-btn.active { background: #3b82f6; }
    
    select[multiple] { height: 120px; background: #1f2937; border: 1px solid #374151; color: white; padding: 5px; border-radius: 4px; width: 100%; font-size: 12px; }
    input { background: #1f2937; border: 1px solid #374151; color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }

    #canvas-wrapper { flex: 1; position: relative; background: #000; border-radius: 12px; border: 1px solid #374151; overflow: hidden; }
    canvas { width: 100%; height: 100%; display: block; }

    /* 툴팁 스타일 */
    #tooltip { position: absolute; background: rgba(15, 23, 42, 0.9); border: 1px solid #3b82f6; padding: 8px 12px; border-radius: 6px; font-size: 12px; pointer-events: none; visibility: hidden; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

    .timeline-container { background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 12px; border: 1px solid #1f2937; display: flex; align-items: center; gap: 20px; }
    #time-slider { flex: 1; cursor: pointer; accent-color: #3b82f6; }
  </style>
</head>
<body>
  <div id="tooltip"></div>
  <div class="container">
    <div class="main-layout">
      <div class="sidebar">
        <h2 style="margin:0; font-size: 16px; color: #94a3b8;">US AIRSPACE OPS</h2>
        <div class="clock" id="clock">00:00</div>

        <div class="stats-panel">
          <div class="section-title">⚡ SIM SPEED</div>
          <div class="speed-grid">
            <button class="speed-btn" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="120">2x</button>
            <button class="speed-btn" data-speed="300">5x</button>
            <button class="speed-btn active" id="btn-custom">C</button>
          </div>
          <input type="number" id="speed-input" value="100" min="1">
        </div>

        <div class="stats-panel">
          <div class="section-title">📅 DATES (MULTI)</div>
          <select id="date-selector" multiple></select>
        </div>

        <div class="stats-panel" id="airport-filters">
          <div class="section-title">📍 ORIGINS</div>
        </div>

        <div class="stats-panel">
          <div class="section-title">LIVE TOTALS</div>
          <div style="font-size: 20px; font-weight: bold; color: #60a5fa;" id="count-active">0</div>
          <div style="font-size: 10px; color: #4b5563;">AIRCRAFT AIRBORNE</div>
        </div>
      </div>

      <div id="canvas-wrapper">
        <canvas id="flight-canvas"></canvas>
      </div>
    </div>

    <div class="timeline-container">
      <input type="range" id="time-slider" min="0" max="1440" value="480">
    </div>
  </div>

  <script>
    const airportCoords = {
      "ORD": { x: 0.66, y: 0.35 }, "ATL": { x: 0.75, y: 0.65 },
      "LAX": { x: 0.10, y: 0.65 }, "DFW": { x: 0.50, y: 0.75 },
      "DEN": { x: 0.40, y: 0.45 }, "JFK": { x: 0.90, y: 0.32 },
      "SEA": { x: 0.15, y: 0.15 }, "SLC": { x: 0.25, y: 0.45 }
    };

    const jsonFiles = [
      { name: "ORD", path: "flight_ord_all.json" }, { name: "JFK", path: "flight_jfk_all.json" },
      { name: "ATL", path: "flight_atl_all.json" }, { name: "LAX", path: "flight_lax_all.json" },
      { name: "DEN", path: "flight_den_all.json" }, { name: "DFW", path: "flight_dfw_all.json" },
      { name: "SEA", path: "flight_sea_all.json" }, { name: "SLC", path: "flight_slc_all.json" }
    ];

    let allFlightData = [];
    let activeOrigins = new Set();
    let selectedDates = new Set();
    let currentTime = 480; 
    let speedMultiplier = 100;
    let isDragging = false;
    let usaMapPath = null;
    let activeFlightsOnScreen = []; // 마우스 오버 감지용

    const canvas = document.getElementById("flight-canvas");
    const ctx = canvas.getContext("2d");
    const tooltip = document.getElementById("tooltip");

    // 1. 배속 설정
    document.querySelectorAll('.speed-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        if(e.target.dataset.speed) {
          speedMultiplier = parseFloat(e.target.dataset.speed);
          document.getElementById('speed-input').value = speedMultiplier / 60; // 버튼은 가시적 배속, 인풋은 내부값
        }
      };
    });

    document.getElementById("speed-input").oninput = (e) => {
      speedMultiplier = parseFloat(e.target.value) * 60 || 1;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('btn-custom').classList.add('active');
    };

    // 2. 마우스 오버 (Tooltip) 처리
    canvas.onmousemove = (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      let found = false;

      // 공항 감지
      for (const [key, pos] of Object.entries(airportCoords)) {
        const ax = pos.x * canvas.width;
        const ay = pos.y * canvas.height;
        const dist = Math.hypot(mx - ax, my - ay);
        if (dist < 10) {
          const stats = getAirportStats(key);
          tooltip.style.visibility = "visible";
          tooltip.style.left = e.clientX + 15 + "px";
          tooltip.style.top = e.clientY + 15 + "px";
          tooltip.innerHTML = `<strong>${key} Airport</strong><br>
                               <span style="color:#10b981">On-Time: ${stats.ontime}</span><br>
                               <span style="color:#f59e0b">Delayed: ${stats.delayed}</span><br>
                               <span style="color:#ef4444">Cancelled: ${stats.cancelled}</span>`;
          found = true; break;
        }
      }

      // 비행기 감지 (공항 못찾았을 때)
      if (!found) {
        for (const f of activeFlightsOnScreen) {
          const dist = Math.hypot(mx - f.x, my - f.y);
          if (dist < 6) {
            tooltip.style.visibility = "visible";
            tooltip.style.left = e.clientX + 15 + "px";
            tooltip.style.top = e.clientY + 15 + "px";
            tooltip.innerHTML = `<strong>Flight ${f.data.FL_NUM}</strong><br>
                                 Dest: ${f.data.DEST}<br>
                                 Status: <span style="color:${f.data.status==='Delayed'?'#f59e0b':'#10b981'}">${f.data.status}</span>`;
            found = true; break;
          }
        }
      }

      if (!found) tooltip.style.visibility = "hidden";
    };

    function getAirportStats(airportCode) {
      const stats = { ontime: 0, delayed: 0, cancelled: 0 };
      allFlightData.forEach(f => {
        if (f.ORIGIN === airportCode && selectedDates.has(f.date) && currentTime >= f.dep_minutes) {
          if (f.status === "On-Time") stats.ontime++;
          else if (f.status === "Delayed") stats.delayed++;
          else if (f.status === "Cancelled") stats.cancelled++;
        }
      });
      return stats;
    }

    async function init() {
      // 흑백 지도 데이터 로드 (D3 사용)
      const us = await d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
      usaMapPath = topojson.feature(us, us.objects.nation).features[0];

      const loadPromises = jsonFiles.map(async (file) => {
        try {
          const res = await fetch(file.path);
          const data = await res.json();
          return data.map(d => ({ ...d, ORIGIN: file.name }));
        } catch(e) { return []; }
      });

      const results = await Promise.all(loadPromises);
      allFlightData = results.flat();

      const dateSet = [...new Set(allFlightData.map(d => d.date))].sort();
      const selector = document.getElementById("date-selector");
      dateSet.forEach(d => {
        const opt = document.createElement("option");
        opt.value = d; opt.textContent = d; selector.appendChild(opt);
      });
      selector.selectedIndex = 0;
      selectedDates.add(dateSet[0]);
      selector.onchange = (e) => selectedDates = new Set(Array.from(e.target.selectedOptions).map(o => o.value));

      const filterBox = document.getElementById("airport-filters");
      jsonFiles.forEach(file => {
        activeOrigins.add(file.name);
        const l = document.createElement("label");
        l.style.display = "block"; l.style.fontSize = "12px";
        l.innerHTML = `<input type="checkbox" checked> ${file.name}`;
        l.querySelector("input").onchange = (e) => e.target.checked ? activeOrigins.add(file.name) : activeOrigins.delete(file.name);
        filterBox.appendChild(l);
      });

      requestAnimationFrame(draw);
    }

    function draw() {
      const { width, height } = canvas;
      ctx.fillStyle = "#000"; ctx.fillRect(0, 0, width, height);

      // 3. 미국 지도 그리기 (흑백 형태만)
      if (usaMapPath) {
        const projection = d3.geoAlbersUsa().scale(width * 1.3).translate([width / 2, height / 2.2]);
        const path = d3.geoPath(projection, ctx);
        ctx.beginPath();
        ctx.strokeStyle = "#1f2937";
        ctx.lineWidth = 1.5;
        path(usaMapPath);
        ctx.stroke();
      }

      activeFlightsOnScreen = [];
      let airborneCount = 0;

      // 비행 경로 점선
      ctx.setLineDash([2, 5]);
      ctx.strokeStyle = "rgba(255,255,255,0.03)";
      allFlightData.forEach(f => {
        if (!activeOrigins.has(f.ORIGIN) || !selectedDates.has(f.date)) return;
        const s = airportCoords[f.ORIGIN], e = airportCoords[f.DEST];
        if (s && e) {
          ctx.beginPath();
          ctx.moveTo(s.x * width, s.y * height); ctx.lineTo(e.x * width, e.y * height);
          ctx.stroke();
        }
      });
      ctx.setLineDash([]);

      // 비행기 렌더링
      allFlightData.forEach(f => {
        if (!activeOrigins.has(f.ORIGIN) || !selectedDates.has(f.date)) return;
        if (f.status !== "Cancelled" && currentTime >= f.dep_minutes && currentTime <= f.dep_minutes + f.duration) {
          const progress = (currentTime - f.dep_minutes) / f.duration;
          const s = airportCoords[f.ORIGIN], e = airportCoords[f.DEST];
          if (s && e) {
            airborneCount++;
            const cx = (s.x + (e.x - s.x) * progress) * width;
            const cy = (s.y + (e.y - s.y) * progress) * height;
            
            activeFlightsOnScreen.push({ x: cx, y: cy, data: f });
            
            ctx.fillStyle = f.status === "Delayed" ? "#f59e0b" : "#10b981";
            ctx.beginPath(); ctx.arc(cx, cy, 3, 0, Math.PI * 2); ctx.fill();
            
            // Glow
            ctx.shadowBlur = 5; ctx.shadowColor = ctx.fillStyle; ctx.stroke(); ctx.shadowBlur = 0;
          }
        }
      });

      // 공항 마커
      Object.keys(airportCoords).forEach(key => {
        const p = airportCoords[key];
        ctx.fillStyle = "#3b82f6"; ctx.beginPath(); ctx.arc(p.x * width, p.y * height, 4, 0, Math.PI*2); ctx.fill();
      });

      document.getElementById("count-active").textContent = airborneCount.toLocaleString();
      document.getElementById("clock").textContent = formatTime(currentTime);
      if(!isDragging) {
        currentTime += (0.1 * speedMultiplier / 60);
        if (currentTime > 1440) currentTime = 0;
        document.getElementById("time-slider").value = currentTime;
      }
      requestAnimationFrame(draw);
    }

    function formatTime(mins) {
      const h = Math.floor(mins / 60) % 24, m = Math.floor(mins % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    window.onresize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
    window.onresize();
    
    // topojson 라이브러리 동적 로드 후 시작
    const script = document.createElement("script");
    script.src = "https://unpkg.com/topojson@3";
    script.onload = init;
    document.head.appendChild(script);
  </script>
</body>
</html>
