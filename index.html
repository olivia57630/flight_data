<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>US Flight Traffic Simulator</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0b1020; color: #f3f4f6; overflow: hidden; }
    .container { display: flex; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; }
    
    /* Sidebar */
    .sidebar { width: 320px; display: flex; flex-direction: column; gap: 15px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; overflow-y: auto; border: 1px solid #1f2937; }
    .clock { font-size: 42px; font-weight: bold; color: #60a5fa; font-family: 'Courier New', Courier, monospace; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 10px; }
    
    /* Stats Panel */
    .stats-panel { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #374151; }
    .stat-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px; }
    .stat-val { font-weight: bold; }
    
    /* Filters */
    .filter-group { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 8px; border: 1px solid #1f2937; }
    .section-title { font-size: 12px; font-weight: bold; margin-bottom: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }
    .checkbox-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .checkbox-item:hover { color: #60a5fa; }
    .checkbox-item input { margin-right: 10px; cursor: pointer; }

    /* Main Viewport */
    #canvas-wrapper { flex: 1; position: relative; background: #0f172a; border-radius: 12px; overflow: hidden; border: 1px solid #374151; box-shadow: inset 0 0 50px rgba(0,0,0,0.5); }
    canvas { width: 100%; height: 100%; display: block; }
    
    /* Controls */
    .speed-btn { padding: 6px 12px; cursor: pointer; background: #374151; border: none; color: white; border-radius: 4px; font-size: 12px; transition: 0.2s; }
    .speed-btn:hover { background: #4b5563; }
    .speed-btn.active { background: #3b82f6; font-weight: bold; }

    /* Delay Info Pop-up */
    #delay-info { position: absolute; bottom: 20px; right: 20px; width: 280px; background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 8px; border-left: 4px solid #f59e0b; display: none; box-shadow: 0 10px 25px rgba(0,0,0,0.5); pointer-events: none; }
    .delay-header { font-size: 11px; color: #f59e0b; font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <div>
        <h2 style="margin:0; font-size: 20px; color: #fff;">FLIGHT TRACKER</h2>
        <div class="clock" id="clock">00:00</div>
      </div>

      <div class="stats-panel">
        <div class="section-title">Cumulative Traffic</div>
        <div class="stat-item">On-Time: <span class="stat-val" id="count-ontime" style="color:#10b981">0</span></div>
        <div class="stat-item">Delayed: <span class="stat-val" id="count-delayed" style="color:#f59e0b">0</span></div>
        <div class="stat-item">Cancelled: <span class="stat-val" id="count-cancelled" style="color:#ef4444">0</span></div>
      </div>

      <div class="filter-group">
        <div class="section-title">Origin Filter</div>
        <div id="airport-filters"></div>
      </div>
      
      <div class="filter-group">
        <div class="section-title">Sim Speed</div>
        <div style="display: flex; gap: 5px;">
            <button class="speed-btn" data-speed="0.5">0.5x</button>
            <button class="speed-btn active" data-speed="1">1.0x</button>
            <button class="speed-btn" data-speed="5">5.0x</button>
            <button class="speed-btn" data-speed="20">20x</button>
        </div>
      </div>

      <div style="margin-top: auto; font-size: 11px; color: #4b5563;">
        * Click orange planes to see delay causes.
      </div>
    </div>

    <div id="canvas-wrapper">
      <canvas id="flight-canvas"></canvas>
      <div id="delay-info">
        <div class="delay-header">Delay Information</div>
        <div id="delay-text" style="font-size: 14px; line-height: 1.4;">Select a plane.</div>
      </div>
    </div>
  </div>

  <script>
    // 1. Configuration & Data
    const airports = {
      "ORD": { x: 0.65, y: 0.35, name: "Chicago O'Hare" },
      "ATL": { x: 0.72, y: 0.65, name: "Atlanta Hartsfield" },
      "LAX": { x: 0.10, y: 0.65, name: "Los Angeles Intl" },
      "DFW": { x: 0.50, y: 0.70, name: "Dallas/Fort Worth" },
      "DEN": { x: 0.40, y: 0.40, name: "Denver Intl" },
      "JFK": { x: 0.88, y: 0.30, name: "New York JFK" }
    };

    // JSON structure example
    const flightData = [
      { "id": "AA101", "origin": "ORD", "dest": "LAX", "dep": 360, "dur": 240, "status": "On-Time" },
      { "id": "DL202", "origin": "ATL", "dest": "JFK", "dep": 380, "dur": 120, "status": "Delayed", "cause": "Heavy Rain & Wind" },
      { "id": "UA303", "origin": "LAX", "dest": "DEN", "dep": 400, "dur": 150, "status": "Cancelled", "cause": "Engine Maintenance" },
      { "id": "WN404", "origin": "DFW", "dest": "ATL", "dep": 420, "dur": 130, "status": "Delayed", "cause": "Late Arrival of Inbound Aircraft" },
      { "id": "AS505", "origin": "DEN", "dest": "ORD", "dep": 450, "dur": 140, "status": "On-Time" },
      { "id": "B6606", "origin": "JFK", "dest": "LAX", "dep": 480, "dur": 360, "status": "On-Time" },
      { "id": "AA707", "origin": "ORD", "dest": "DFW", "dep": 500, "dur": 120, "status": "Delayed", "cause": "Air Traffic Control Congestion" },
      { "id": "DL889", "origin": "ATL", "dest": "ORD", "dep": 520, "dur": 110, "status": "On-Time" },
      { "id": "UA912", "origin": "DEN", "dest": "JFK", "dep": 540, "dur": 220, "status": "On-Time" }
    ];

    const canvas = document.getElementById("flight-canvas");
    const ctx = canvas.getContext("2d");
    const clockEl = document.getElementById("clock");
    const delayInfo = document.getElementById("delay-info");
    const delayText = document.getElementById("delay-text");
    
    let currentTime = 300; // Start at 05:00
    let speedMultiplier = 1;
    let activeOrigins = new Set(Object.keys(airports));

    // 2. Initialize UI
    const filterBox = document.getElementById("airport-filters");
    Object.keys(airports).forEach(code => {
      const label = document.createElement("label");
      label.className = "checkbox-item";
      label.innerHTML = `<input type="checkbox" checked value="${code}"> ${code}`;
      label.querySelector("input").addEventListener("change", (e) => {
        if (e.target.checked) activeOrigins.add(code);
        else activeOrigins.delete(code);
      });
      filterBox.appendChild(label);
    });

    function resize() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // 3. Render Loop
    function draw() {
      const { width, height } = canvas;
      
      // Clear with trail effect
      ctx.fillStyle = "rgba(15, 23, 42, 0.3)";
      ctx.fillRect(0, 0, width, height);

      // Draw Airports
      Object.keys(airports).forEach(key => {
        const {x, y} = airports[key];
        ctx.fillStyle = activeOrigins.has(key) ? "#334155" : "#1e293b";
        ctx.beginPath(); ctx.arc(x * width, y * height, 4, 0, Math.PI*2); ctx.fill();
        ctx.font = "bold 10px sans-serif";
        ctx.fillStyle = activeOrigins.has(key) ? "#94a3b8" : "#475569";
        ctx.fillText(key, x * width + 8, y * height + 4);
      });

      let stats = { ontime: 0, delayed: 0, cancelled: 0 };

      // Process Flights
      flightData.forEach(f => {
        if (!activeOrigins.has(f.origin)) return;

        // Statistics 집계
        if (currentTime >= f.dep) {
          if (f.status === "On-Time") stats.ontime++;
          else if (f.status === "Delayed") stats.delayed++;
          else if (f.status === "Cancelled") stats.cancelled++;
        }

        // Draw In-flight planes
        if (f.status !== "Cancelled" && currentTime >= f.dep && currentTime <= f.dep + f.dur) {
          const progress = (currentTime - f.dep) / f.dur;
          const start = airports[f.origin];
          const end = airports[f.dest];

          if (start && end) {
            const curX = (start.x + (end.x - start.x) * progress) * width;
            const curY = (start.y + (end.y - start.y) * progress) * height;

            // Color based on status
            ctx.fillStyle = f.status === "Delayed" ? "#f59e0b" : "#10b981";
            ctx.beginPath(); ctx.arc(curX, curY, 5, 0, Math.PI * 2); ctx.fill();
            
            // Pulsing effect for delayed flights
            if (f.status === "Delayed") {
              ctx.strokeStyle = "rgba(245, 158, 11, 0.4)";
              ctx.lineWidth = 2;
              ctx.beginPath(); ctx.arc(curX, curY, 8 + Math.sin(Date.now()/150)*3, 0, Math.PI*2); ctx.stroke();
            }

            ctx.fillStyle = "white";
            ctx.font = "10px sans-serif";
            ctx.fillText(f.id, curX + 8, curY - 8);
          }
        }
      });

      // Update UI Stats
      document.getElementById("count-ontime").textContent = stats.ontime;
      document.getElementById("count-delayed").textContent = stats.delayed;
      document.getElementById("count-cancelled").textContent = stats.cancelled;

      // Update Clock
      clockEl.textContent = formatTime(currentTime);
      currentTime += (0.1 * speedMultiplier); // Smoother time flow
      if (currentTime > 1440) currentTime = 0;

      requestAnimationFrame(draw);
    }

    function formatTime(mins) {
      const h = Math.floor(mins / 60) % 24;
      const m = Math.floor(mins % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    // 4. Interaction
    canvas.addEventListener("click", (e) => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      
      let target = null;
      flightData.forEach(f => {
        if (f.status === "Delayed" && currentTime >= f.dep && currentTime <= f.dep + f.dur) {
          const progress = (currentTime - f.dep) / f.dur;
          const x = (airports[f.origin].x + (airports[f.dest].x - airports[f.origin].x) * progress) * canvas.width;
          const y = (airports[f.origin].y + (airports[f.dest].y - airports[f.origin].y) * progress) * canvas.height;
          
          if (Math.hypot(x - mx, y - my) < 15) target = f;
        }
      });

      if (target) {
        delayInfo.style.display = "block";
        delayText.innerHTML = `<strong>${target.id}</strong> (${target.origin} → ${target.dest})<br><br>Reason:<br><span style="color:#fcd34d">${target.cause}</span>`;
      } else {
        delayInfo.style.display = "none";
      }
    });

    document.querySelectorAll(".speed-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        document.querySelectorAll(".speed-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        speedMultiplier = parseFloat(e.target.dataset.speed);
      });
    });

    draw();
  </script>
</body>
</html>
