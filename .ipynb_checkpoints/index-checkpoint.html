<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>US Flight Traffic Simulator (Pro)</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #0b1020; color: #f3f4f6; overflow: hidden; }
    .container { display: flex; height: 100vh; padding: 20px; gap: 20px; box-sizing: border-box; flex-direction: column; }
    .main-layout { display: flex; flex: 1; gap: 20px; min-height: 0; }
    
    /* 사이드바 스타일 */
    .sidebar { width: 300px; display: flex; flex-direction: column; gap: 15px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; border: 1px solid #1f2937; overflow-y: auto; }
    .clock { font-size: 42px; font-weight: bold; color: #60a5fa; font-family: monospace; text-align: center; border-bottom: 1px solid #374151; padding-bottom: 10px; }
    
    .stats-panel { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; border: 1px solid #374151; }
    .stat-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
    .stat-value { font-weight: bold; font-family: monospace; font-size: 16px; }

    .input-group { display: flex; gap: 5px; margin-top: 5px; }
    input[type="number"] { background: #1f2937; border: 1px solid #374151; color: white; padding: 5px; border-radius: 4px; width: 80px; }
    .apply-btn { cursor: pointer; background: #3b82f6; border: none; color: white; padding: 5px 10px; border-radius: 4px; }

    /* 지도 및 캔버스 */
    #canvas-wrapper { flex: 1; position: relative; background: #0f172a; border-radius: 12px; border: 1px solid #374151; }
    canvas { width: 100%; height: 100%; display: block; }

    /* 타임라인 슬라이더 */
    .timeline-container { background: rgba(255,255,255,0.05); padding: 15px 25px; border-radius: 12px; border: 1px solid #1f2937; display: flex; align-items: center; gap: 20px; }
    #time-slider { flex: 1; cursor: pointer; accent-color: #3b82f6; }
    
    #delay-info { position: absolute; bottom: 20px; right: 20px; width: 260px; background: rgba(15, 23, 42, 0.95); padding: 15px; border-radius: 8px; border-left: 4px solid #f59e0b; display: none; pointer-events: none; }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-layout">
      <div class="sidebar">
        <h2 style="margin:0; font-size: 20px;">FLIGHT TRACKER</h2>
        <div class="clock" id="clock">08:00</div>

        <div class="stats-panel">
          <div style="font-size: 12px; color: #9ca3af; margin-bottom: 10px; text-transform: uppercase; font-weight: bold;">Flight Statistics</div>
          <div class="stat-item">Airborne (Live): <span id="count-active" class="stat-value" style="color:#60a5fa">0</span></div>
          <hr style="border: 0; border-top: 1px solid #374151; margin: 10px 0;">
          <div class="stat-item">On-Time (Acc): <span id="count-ontime" class="stat-value" style="color:#10b981">0</span></div>
          <div class="stat-item">Delayed (Acc): <span id="count-delayed" class="stat-value" style="color:#f59e0b">0</span></div>
          <div class="stat-item">Cancelled (Acc): <span id="count-cancelled" class="stat-value" style="color:#ef4444">0</span></div>
        </div>

        <div class="stats-panel">
          <div style="font-size: 12px; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; font-weight: bold;">1. Sim Speed</div>
          <div class="input-group">
            <input type="number" id="speed-input" value="20" min="0.1" step="0.5">
            <button class="apply-btn" id="set-speed">Apply</button>
          </div>
        </div>

        <div class="stats-panel">
          <div style="font-size: 12px; color: #9ca3af; margin-bottom: 5px; text-transform: uppercase; font-weight: bold;">Origin Filter</div>
          <div id="airport-filters"></div>
        </div>
      </div>

      <div id="canvas-wrapper">
        <canvas id="flight-canvas"></canvas>
        <div id="delay-info">
          <div style="font-size:11px; color:#f59e0b; font-weight:bold; margin-bottom:5px;">DELAY INFO</div>
          <div id="delay-text" style="font-size:14px;"></div>
        </div>
      </div>
    </div>

    <div class="timeline-container">
      <span style="font-family: monospace; font-weight: bold; color: #9ca3af;">00:00</span>
      <input type="range" id="time-slider" min="0" max="1440" value="480">
      <span style="font-family: monospace; font-weight: bold; color: #9ca3af;">23:59</span>
    </div>
  </div>

  <script>
    const airportCoords = {
      "ORD": { x: 0.66, y: 0.35 }, "ATL": { x: 0.75, y: 0.65 },
      "LAX": { x: 0.10, y: 0.65 }, "DFW": { x: 0.50, y: 0.75 },
      "DEN": { x: 0.40, y: 0.45 }, "JFK": { x: 0.90, y: 0.32 },
      "SFO": { x: 0.08, y: 0.50 }, "SEA": { x: 0.15, y: 0.15 },
      "LAS": { x: 0.18, y: 0.58 }, "MIA": { x: 0.88, y: 0.88 }
    };

    const jsonFiles = [{ name: "ORD", path: "flight.json" }];
    let allFlightData = [];
    let activeOrigins = new Set();
    let currentTime = 480; 
    let speedMultiplier = 20;
    let isDragging = false;

    const canvas = document.getElementById("flight-canvas");
    const ctx = canvas.getContext("2d");
    const timeSlider = document.getElementById("time-slider");

    // 1. 배속 설정 이벤트
    document.getElementById("set-speed").onclick = () => {
      speedMultiplier = parseFloat(document.getElementById("speed-input").value);
    };

    // 2. 슬라이더 드래그 이벤트
    timeSlider.oninput = (e) => {
      isDragging = true;
      currentTime = parseInt(e.target.value);
    };
    timeSlider.onchange = () => { isDragging = false; };

    async function init() {
      try {
        const loadPromises = jsonFiles.map(async (file) => {
          const res = await fetch(file.path);
          const data = await res.json();
          return data.map(d => ({ ...d, ORIGIN: file.name }));
        });

        const results = await Promise.all(loadPromises);
        allFlightData = results.flat();

        const filterBox = document.getElementById("airport-filters");
        jsonFiles.forEach(file => {
          activeOrigins.add(file.name);
          const label = document.createElement("label");
          label.style.display = "block";
          label.innerHTML = `<input type="checkbox" checked value="${file.name}"> ${file.name}`;
          label.querySelector("input").onchange = (e) => {
            if (e.target.checked) activeOrigins.add(file.name);
            else activeOrigins.delete(file.name);
          };
          filterBox.appendChild(label);
        });

        requestAnimationFrame(draw);
      } catch (err) { console.error(err); }
    }

    function draw() {
      const { width, height } = canvas;
      ctx.fillStyle = "rgba(15, 23, 42, 0.4)";
      ctx.fillRect(0, 0, width, height);

      // 공항 표시
      Object.keys(airportCoords).forEach(key => {
        const {x, y} = airportCoords[key];
        ctx.fillStyle = "#334155";
        ctx.beginPath(); ctx.arc(x * width, y * height, 4, 0, Math.PI*2); ctx.fill();
        ctx.font = "11px sans-serif";
        ctx.fillStyle = "#64748b";
        ctx.fillText(key, x * width + 5, y * height + 15);
      });

      // 3. 통계 계산 변수
      let stats = { ontime: 0, delayed: 0, cancelled: 0, active: 0 };

      allFlightData.forEach(f => {
        if (!activeOrigins.has(f.ORIGIN)) return;

        // 누적 통계 (현재 시간보다 이전에 출발한 것들)
        if (currentTime >= f.dep_minutes) {
          if (f.status === "On-Time") stats.ontime++;
          else if (f.status === "Delayed") stats.delayed++;
          else if (f.status === "Cancelled") stats.cancelled++;
        }

        // 현재 운행 중인 비행기 계산 및 그리기
        if (f.status !== "Cancelled" && currentTime >= f.dep_minutes && currentTime <= f.dep_minutes + f.duration) {
          const progress = (currentTime - f.dep_minutes) / f.duration;
          const start = airportCoords[f.ORIGIN];
          const end = airportCoords[f.DEST];

          if (start && end) {
            stats.active++;
            const curX = (start.x + (end.x - start.x) * progress) * width;
            const curY = (start.y + (end.y - start.y) * progress) * height;
            
            ctx.fillStyle = f.status === "Delayed" ? "#f59e0b" : "#10b981";
            ctx.beginPath(); ctx.arc(curX, curY, 5, 0, Math.PI * 2); ctx.fill();
            ctx.font = "10px monospace";
            ctx.fillStyle = "white";
            ctx.fillText(f.FL_NUM, curX + 7, curY - 5);
          }
        }
      });

      // UI 업데이트
      document.getElementById("count-active").textContent = stats.active;
      document.getElementById("count-ontime").textContent = stats.ontime;
      document.getElementById("count-delayed").textContent = stats.delayed;
      document.getElementById("count-cancelled").textContent = stats.cancelled;
      document.getElementById("clock").textContent = formatTime(currentTime);
      if(!isDragging) timeSlider.value = currentTime;

      // 시간 업데이트
      if (!isDragging) {
        currentTime += (0.1 * speedMultiplier);
        if (currentTime > 1440) currentTime = 0;
      }
      
      requestAnimationFrame(draw);
    }

    function formatTime(mins) {
      const h = Math.floor(mins / 60) % 24;
      const m = Math.floor(mins % 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    window.onresize = () => {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    };
    window.onresize();
    init();
  </script>
</body>
</html>
